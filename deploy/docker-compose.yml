name: ai-sre-agent

# Ports are bound to 127.0.0.1 so the demo environment is not exposed on the network.

services:
  inventory-api:
    build:
      context: ..
      args:
        SERVICE: inventory-api
    environment:
      ADDR: ":8081"
      ADMIN_ADDR: ":9081"
      BASE_LATENCY: "20ms"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://tempo:4318/v1/traces"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://loki:3100/otlp/v1/logs"
    ports:
      - "127.0.0.1:8081:8081"
      # Fault-injection admin API. Not scraped by Prometheus.
      - "127.0.0.1:9081:9081"
    depends_on:
      - tempo
      - loki

  checkout-api:
    build:
      context: ..
      args:
        SERVICE: checkout-api
    environment:
      ADDR: ":8080"
      INVENTORY_URL: "http://inventory-api:8081"
      INVENTORY_TIMEOUT: "2s"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://tempo:4318/v1/traces"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://loki:3100/otlp/v1/logs"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - inventory-api
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - checkout-api
      - inventory-api

  # Trace backend. Services push spans to it over OTLP/HTTP (4318); its query
  # API is published on 3200. 4318 is also published so the scenario runner,
  # which runs on the host, can export the agent's own spans.
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"

  # Log backend. Services push logs to its native OTLP endpoint
  # (/otlp/v1/logs); its query API is published on 3100. The fault admin API's
  # logs are never sent here (ADR 0001).
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  # UI for people, not for the agent: view agent and service traces, logs, and
  # metrics through provisioned datasources. Anonymous access, no dashboards;
  # state is discarded with the container. Viewers cannot open Explore unless
  # viewers_can_edit is set; it is deprecated, but it grants only Explore,
  # where the Editor role would also allow creating dashboards.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
