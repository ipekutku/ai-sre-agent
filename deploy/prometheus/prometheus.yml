global:
  # Short intervals so incidents become visible within seconds during demos.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # job_name becomes the "job" label and is the service name used in queries.
  - job_name: checkout-api
    static_configs:
      - targets: ["checkout-api:8080"]

  - job_name: inventory-api
    static_configs:
      - targets: ["inventory-api:8081"]
